name: Feature request
description: Something the addon should be able to do
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: A workaround that already exists is useful to know — it tells us how much this actually costs.

  - type: checkboxes
    id: extension-points
    attributes:
      label: Have you checked whether an extension point already covers it?
      description: See docs/advanced.md — commit messages, path filtering, sync strategies and health checks can all be replaced without changing this package.
      options:
        - label: Yes, and none of them fit
        - label: Not sure — please advise
