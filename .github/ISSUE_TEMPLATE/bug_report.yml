name: Bug report
description: Something does not work the way the documentation says it does
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `php artisan statamic:git-sync:doctor`. It checks the
        git binary, the repository, the identity, the branch, the remote, the
        content paths, cache locks, the queue driver and the scheduler — and it
        catches most reports on its own.

  - type: textarea
    id: doctor
    attributes:
      label: Output of `php artisan statamic:git-sync:doctor`
      description: Credentials are already redacted.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      placeholder: I saved an entry in the control panel and no commit appeared.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set STATAMIC_GIT_SYNC_PUSH=true
        2. Save an entry
        3. Wait for the debounce window
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: statamic-version
    attributes:
      label: Statamic version
      placeholder: 6.26.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.14
    validations:
      required: true

  - type: input
    id: queue
    attributes:
      label: Queue connection and driver
      placeholder: redis
    validations:
      required: true

  - type: input
    id: cache
    attributes:
      label: Cache store
      placeholder: redis
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Set STATAMIC_GIT_SYNC_LOG_LEVEL=debug first — it includes the runs that found nothing and the ones that stood aside.
      render: text
